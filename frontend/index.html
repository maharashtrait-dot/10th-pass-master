<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10th PASS MASTER</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="visual-learning.css">
</head>

<body>
<div class="container">

    <header>
        <h1>🎓 10th PASS MASTER</h1>
        <p>Maharashtra SSC Pass-Oriented Study App</p>
    </header>

    <section class="welcome">
        <h2 id="welcomeMessage"></h2>
        <p>Learn easy. Practice daily. PASS with confidence. 💪</p>
    </section>

    <section id="studentSection">
        <h2>👨‍🎓 Student Login / Registration</h2>

        <input
            type="text"
            id="studentName"
            placeholder="Enter your name"
        >

        <input
            type="tel"
            id="studentMobile"
            placeholder="Enter 10 digit mobile number"
            maxlength="10"
        >

        <br><br>

        <button id="startStudyButton">
            🚀 Start Studying
        </button>

        <p id="studentMessage"></p>
    </section>

    <div class="student-actions">
        <button id="dailyQuestionsButton">
            🎯 Today's 10 Questions
        </button>

        <button id="myRevisionButton">
            📚 My Revision
        </button>

        <button id="smartRevisionButton">
            🧠 Smart Revision
        </button>

        <button id="passChallengeButton">
            📅 30-Day PASS Challenge
        </button>

        <button id="passReadinessButton">
            🏆 PASS Readiness
        </button>

        <button id="dailyStreakButton">
            🔥 Daily Streak
        </button>

        <button id="studentDashboardButton">
            📊 My Dashboard
        </button>

        <button id="achievementsButton">
            🏆 Achievements
        </button>

        <button id="pyqLibraryButton">
            📚 PYQ Library
        </button>

        <button id="pyqPriorityButton">
            🎯 PYQ First – PASS Priority
        </button>

        <button id="pyqMasterButton">
            🏆 PYQ Master – What to Study First
        </button>

        <button id="mockTestButton">
            📝 Mock Test
        </button>

        <button id="examAnalysisButton">
            📊 Exam Analysis
        </button>

        <button
            id="logoutButton"
            style="display:none;"
        >
            🚪 Logout
        </button>
    </div>

    <section id="subjectsContainer">
        <p>
            Please enter your name and mobile number to start studying.
        </p>
    </section>

    <section class="progress">
        <h2>📊 Your Progress</h2>
        <p>Login to see your study progress.</p>
    </section>

</div>

<script src="visual-learning.js?v=5"></script>
<script src="script.js?v=65smartstudy20260911"></script>
</body>
</html>
